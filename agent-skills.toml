# External agent skills managed by this dotfiles repository.
#
# `agents/skills` holds first-party skills. Use this manifest for skills fetched
# from an upstream Git repository so the source, version, and target hosts stay
# reviewable. `agent-skills-sync` checks out each pinned ref and copies only the
# declared skill directory into the requested user-level skill locations.

version = 1

[[skill]]
name = "gh-stack"
repository = "https://github.com/github/gh-stack.git"
path = "skills/gh-stack"
# Renovate updates `ref` above via the regex manager in renovate.json5.
# `rev` is the commit SHA that `ref` pointed to when last reviewed; it must be
# updated by a human after reviewing the upstream diff. agent-skills-sync fails
# loudly if `ref` and `rev` disagree (i.e. the tag moved without review).
# renovate: datasource=github-releases depName=github/gh-stack versioning=semver
ref = "v0.1.0"
rev = "a1b4a3d4d0bcde9ec3a78ab99b2d63af121857a9"
targets = ["agents", "claude"]
license = "MIT"

# ponytail: 6 skills in one repo, one entry per skill directory.
# rev = commit for tag v4.10.0 (git ls-remote refs/tags/v4.10.0).

[[skill]]
name = "ponytail"
repository = "https://github.com/DietrichGebert/ponytail.git"
path = "skills/ponytail"
# renovate: datasource=github-releases depName=DietrichGebert/ponytail versioning=semver
ref = "v4.10.0"
rev = "1d95ff7d39de12d87014ea40d4e22201bddc501b"
targets = ["agents"]
