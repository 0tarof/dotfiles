# Global defaults for mise. Linked to ~/.config/mise/config.toml by Home Manager.
# Keep the name off mise's auto-detected list (mise/config.toml, mise.toml, ...):
# otherwise mise loads this file again as a project config while we work in this
# repo, and warns that credential_command in a non-global config is ignored.
# - Runtimes: pin to patch here; override per-project with .mise.toml
# - CLIs: prefer Nix (home.packages). Keep here only when Nix is missing,
#   too old, or a specific version must be pinned independently.
[settings]
disable_backends = ["vfox"]
minimum_release_age = "7d"
pin = true

[settings.pipx]
uvx = true

[settings.github]
# gh_cli_tokens reads only hosts.yml; our token lives in the Keychain.
credential_command = "gh auth token"

[plugins]
mysql = "https://github.com/iroddis/asdf-mysql"

[tools]
# Runtimes (project-local overrides expected)
go = "1.26.5"
java = "26.0.1"
maven = "3.9.16"
node = "24.18.0"
python = "3.14.6"
rust = "1.96.1"

# CLIs kept in mise (not suitable for Nix yet)
# kubernetes-helm in locked nixpkgs is still 3.x; track Helm 4 here.
helm = "4.2.2"
# snowflake-cli build fails in nixpkgs
"pipx:snowflake-cli" = "3.21.0"
# ast-grep: the outline subcommand landed in 0.44; locked nixpkgs is still 0.42.1.
ast-grep = "0.45.1"

# Language-ecosystem CLIs (npm / cargo)
"npm:agent-browser" = "0.35.1"
"npm:difit" = "5.0.8"
"cargo:keifu" = "0.5.0"
"cargo:filetree" = "0.3.5"
